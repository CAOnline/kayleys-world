<div class="aurora"></div>
<div class="orb orb-1"></div>

<div class="loader" id="loader">
  <div class="loader-mark">Kayley's World</div>
  <div class="loader-line"></div>
</div>
<div class="app">

<div class="page active" id="motivation">
  <div class="page-header">
    <div class="page-title-stack">
      <div class="eyebrow">Daily Word</div>
      <h2 class="page-title">For<br><em>You, today</em></h2>
    </div>
  </div>
  <div class="motivation-page">
    <div class="moti-card" id="motiCard">
      <div class="moti-mark">"</div>
      <div class="moti-text" id="motiText"></div>
      <div class="moti-attribution" id="motiAttribution"></div>
    </div>
    <div class="moti-actions">
      <button class="moti-btn" onclick="rerollMotivation()">Another one</button>
      <button class="moti-btn" onclick="shareMotivation()">Save</button>
    </div>
  </div>
</div>

</div><!-- /app -->

}
