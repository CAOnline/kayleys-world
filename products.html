<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Shelf — Kayley's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared.css?v=3">
</head>
<body>
<div class="aurora"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="loader" id="loader">
  <div class="loader-mark">Kayley's World</div>
  <div class="loader-line"></div>
</div>
<div class="app">

<div class="page active" id="products">
  <div class="page-header">
    <div class="page-title-stack">
      <div class="eyebrow">The Collection</div>
      <h2 class="page-title">Your<br><em>Shelf</em></h2>
    </div>
  </div>

  <div class="products-controls">
    <section class="shelf-summary" id="shelfSummary" aria-label="Shelf overview"></section>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="search your shelf...">
    </div>
    <div class="shelf-views" aria-label="Product view">
      <button data-view="all" onclick="setProductView('all')">Everything</button>
      <button data-view="low" onclick="setProductView('low')">Running low</button>
      <button data-view="empty" onclick="setProductView('empty')">Restock</button>
    </div>
    <div class="cat-chips scroll-x" id="catChips"></div>
  </div>

  <div class="products-list" id="productsList"></div>
  <div class="shelf-add-dock">
    <button class="add-product-btn" onclick="openAddProduct()">+ Add a new product</button>
  </div>
</div>

</div><!-- /app -->

<!-- Product Modal -->
<div class="modal-overlay" id="productModal" onclick="if(event.target===this)closeModal('productModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="productModalTitle">Edit product</div>
    <div class="modal-sub" id="productModalSub">Update the details</div>
    <div class="field"><label class="field-label">Name</label><input class="field-input" id="pName" type="text"></div>
    <div class="field">
      <label class="field-label">Category</label>
      <select class="field-select" id="pCategory">
        <option value="cleansers">Cleansers</option>
        <option value="toners">Toners</option>
        <option value="serums">Serums & Treatments</option>
        <option value="eyes">Eye Care</option>
        <option value="lips">Lip Care</option>
        <option value="moisturisers">Moisturisers</option>
        <option value="sunscreen">Sunscreen</option>
        <option value="masks">Masks</option>
        <option value="tools">Tools & Devices</option>
        <option value="body">Body & Other</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">Where from</label>
      <select class="field-select" id="pStore">
        <option value="">Select...</option>
        <option>Lookfantastic</option><option>Amazon</option><option>Boots</option>
        <option>Superdrug</option><option>ASOS</option><option>Shein</option>
        <option>Temu</option><option>Primark</option><option>Cult Beauty</option>
        <option>Sephora</option><option>Other</option>
      </select>
    </div>
    <div class="field"><label class="field-label">Price</label><input class="field-input" id="pPrice" type="text" placeholder="£0.00"></div>
    <div class="field">
      <label class="field-label">How much left</label>
      <div class="stock-options">
        <div class="stock-opt" data-stock="full" onclick="setStock('full')"><div class="stock-opt-dot stock-full"></div><div class="stock-opt-label">Full</div></div>
        <div class="stock-opt" data-stock="good" onclick="setStock('good')"><div class="stock-opt-dot stock-good"></div><div class="stock-opt-label">Good</div></div>
        <div class="stock-opt" data-stock="low" onclick="setStock('low')"><div class="stock-opt-dot stock-low"></div><div class="stock-opt-label">Low</div></div>
        <div class="stock-opt" data-stock="empty" onclick="setStock('empty')"><div class="stock-opt-dot stock-empty"></div><div class="stock-opt-label">Empty</div></div>
      </div>
    </div>
    <div class="field"><label class="field-label">Notes</label><input class="field-input" id="pNotes" type="text" placeholder="anything to remember..."></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="deleteBtn" onclick="deleteCurrentProduct()" style="color:var(--red);border-color:rgba(251,113,133,0.3)">Remove</button>
      <button class="btn-primary" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

<nav class="bottom-nav bottom-nav-core" aria-label="Primary navigation">
  <button class="nav-btn" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V21H3z"/><path d="M9 21V12h6v9"/></svg>
    <span class="nav-label">Home</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='routine.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2C8 2 6 6 6 9c0 6 6 13 6 13s6-7 6-13c0-3-2-7-6-7z"/></svg>
    <span class="nav-label">Routine</span>
  </button>
  <button class="nav-btn active" aria-current="page" onclick="window.location.href='products.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 5h18l-2 14H5z"/><path d="M9 5V3h6v2"/></svg>
    <span class="nav-label">Products</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='scripture.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4v16a2 2 0 0 0 2 2h14V2H6a2 2 0 0 0-2 2z"/><path d="M8 6h8M8 10h8M8 14h5"/></svg>
    <span class="nav-label">Scripture</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="shared.js?v=3"></script>
<script>
async function init(){
  await loadFromCloud();
  renderProducts();
  setTimeout(()=>{
    $('loader').classList.add('hide');
    setTimeout(()=>$('loader').remove(),700);
  },700);
}
init();
</script>
</body>
</html>
