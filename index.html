<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kayley's World">
<title>Kayley's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="aurora"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="loader" id="loader">
  <div class="loader-mark">Kayley's World</div>
  <div class="loader-line"></div>
</div>

<div class="app">

<div class="page active" id="landing">
  <div class="landing landing-centered">

    <div class="hero-block stagger">
      <div class="greeting-mark" id="greeting">good morning, sunshine</div>
      <h1 class="hero-title hero-title-big">Kayley's<br><span class="it">World</span></h1>
      <div class="hero-sub" id="todaysVibe">Soft mornings, slow rituals — your skin, your sanctuary.</div>
    </div>

    <div class="duo-nav stagger">
      <div class="duo-card duo-ritual" onclick="window.location.href='routine.html'">
        <div class="duo-glow"></div>
        <div class="duo-icon">✿</div>
        <div class="duo-title">The Ritual</div>
        <div class="duo-desc" id="ritualMeta">— loading —</div>
        <div class="duo-arrow">→</div>
      </div>
      <div class="duo-card duo-shelf" onclick="window.location.href='products.html'">
        <div class="duo-glow"></div>
        <div class="duo-icon">✨</div>
        <div class="duo-title">The Shelf</div>
        <div class="duo-desc"><span id="statProducts">—</span> products in your collection</div>
        <div class="duo-arrow">→</div>
      </div>
      <div class="duo-card duo-verse" onclick="window.location.href='scripture.html'">
        <div class="duo-glow"></div>
        <div class="duo-icon">𓆗</div>
        <div class="duo-title">The Word</div>
        <div class="duo-desc" id="verseRefHome">today's verse · CE course · notes</div>
        <div class="duo-arrow">→</div>
      </div>
    </div>

    <div class="landing-foot stagger">
      <div class="date-line" id="dateLine">Monday 13 July</div>
    </div>

  </div>
</div>

</div><!-- /app -->

<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
async function init(){
  await loadFromCloud();
  renderLanding();
  setTimeout(()=>{
    $('loader').classList.add('hide');
    setTimeout(()=>$('loader').remove(),700);
  },700);
}

function renderLanding(){
  const d = new Date();
  const hour = d.getHours();
  let greeting = 'good morning, sunshine';
  let vibe = 'Soft mornings, slow rituals — your skin, your sanctuary.';
  if(hour>=12&&hour<17){greeting='hello, lovely';vibe='Afternoon glow check — sip water, breathe in.'}
  else if(hour>=17&&hour<21){greeting='good evening, beautiful';vibe='Evening rituals, soft lights, gentle hands.'}
  else if(hour>=21||hour<5){greeting='wind down, dreamer';vibe='Wash the day away. Tomorrow holds promises.'}
  $('greeting').textContent = greeting;
  $('todaysVibe').textContent = vibe;

  $('statProducts').textContent = state.products.length || '—';

  const ritualMeta = hour < 12
    ? 'Morning routine ready'
    : (isRetinolNight() ? 'Tonight is a retinol night' : (isMaskFriendlyNight() ? 'Mask-friendly evening' : 'Gentle evening ahead'));
  $('ritualMeta').textContent = ritualMeta;

  $('dateLine').textContent = d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});

  const todaysVerse = VERSES[dayOfYear() % VERSES.length];
  if(todaysVerse && $('verseRefHome')) $('verseRefHome').textContent = 'Today: ' + todaysVerse.ref;
}

init();
</script>
</body>
</html>
