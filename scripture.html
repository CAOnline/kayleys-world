<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E8DFF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scripture — Kayley's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="aurora"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="loader" id="loader">
  <div class="loader-mark">Kayley's World</div>
  <div class="loader-line"></div>
</div>
<div class="app">

<div class="page active" id="scripture">
  <div class="page-header">
    <div class="page-title-stack">
      <div class="eyebrow">Today's Verse</div>
      <h2 class="page-title">Scripture<br><em>& Study</em></h2>
    </div>
  </div>

  <div class="scripture-page">
    <div class="trans-toggle">
      <button class="trans-btn active" data-trans="all" onclick="setTrans('all')">All</button>
      <button class="trans-btn" data-trans="kjv" onclick="setTrans('kjv')">KJV</button>
      <button class="trans-btn" data-trans="modern" onclick="setTrans('modern')">Modern</button>
      <button class="trans-btn" data-trans="enoch" onclick="setTrans('enoch')">Enoch</button>
    </div>

    <div class="verse-card" id="verseCard">
      <div class="verse-illumination">✦</div>
      <div class="verse-ref" id="verseRef"></div>
      <div class="verse-text" id="verseText"></div>
      <div class="verse-translation" id="verseTrans"></div>
    </div>

    <div class="study-card">
      <div class="study-eyebrow"><span>𓆗</span><span>Study notes</span></div>
      <div class="study-section">
        <div class="study-label">Context</div>
        <div class="study-body" id="studyContext"></div>
      </div>
      <div class="study-section">
        <div class="study-label">What it means</div>
        <div class="study-body" id="studyMeaning"></div>
      </div>
      <div class="study-section">
        <div class="study-label">For today</div>
        <div class="study-body study-italic" id="studyApplication"></div>
      </div>
    </div>

    <div class="reflection-card">
      <div class="study-eyebrow"><span>✿</span><span>Reflect</span></div>
      <div class="reflection-prompt" id="reflectionPrompt"></div>
      <textarea class="reflection-input" id="reflectionText" placeholder="write what comes to mind..."></textarea>
      <button class="btn-primary" onclick="saveReflection()">Save reflection</button>
    </div>

    <div class="moti-actions" style="margin-top:14px">
      <button class="moti-btn" onclick="prevVerse()">← Previous</button>
      <button class="moti-btn" onclick="nextVerse()">Next →</button>
    </div>
  </div>
</div>

</div><!-- /app -->

<div class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V21H3z"/><path d="M9 21V12h6v9"/></svg>
    <span class="nav-label">Home</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='routine.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2C8 2 6 6 6 9c0 6 6 13 6 13s6-7 6-13c0-3-2-7-6-7z"/></svg>
    <span class="nav-label">Ritual</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='products.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 5h18l-2 14H5z"/><path d="M9 5V3h6v2"/></svg>
    <span class="nav-label">Shelf</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='motivation.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2.4 7.6H22l-6.2 4.5 2.4 7.6L12 17.2 5.8 21.7l2.4-7.6L2 9.6h7.6z"/></svg>
    <span class="nav-label">Word</span>
  </button>
  <button class="nav-btn active" onclick="window.location.href='scripture.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4v16a2 2 0 0 0 2 2h14V2H6a2 2 0 0 0-2 2z"/><path d="M8 6h8M8 10h8M8 14h5"/></svg>
    <span class="nav-label">Verse</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='wellness.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span class="nav-label">Inner</span>
  </button>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script>
async function init(){
  await loadFromCloud();
  renderScripture();
  setTimeout(()=>{ $('loader').classList.add('hide'); setTimeout(()=>$('loader').remove(),700); },600);
}
init();
</script>
</body>
</html>
