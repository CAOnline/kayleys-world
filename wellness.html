<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E8DFF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Inner World — Kayley's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Outfit:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="aurora"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="loader" id="loader">
  <div class="loader-mark">Kayley's World</div>
  <div class="loader-line"></div>
</div>
<div class="app">

<div class="page active" id="wellness">
  <div class="page-header">
    <div class="page-title-stack">
      <div class="eyebrow">Inner World</div>
      <h2 class="page-title">How are<br><em>you, really?</em></h2>
    </div>
  </div>

  <div class="wellness-page">
    <div class="wellness-intro">A little check-in. Just for you, just for today.</div>

    <div class="well-tabs">
      <button class="well-tab active" data-tab="checkin" onclick="setWellTab('checkin')">Check-in</button>
      <button class="well-tab" data-tab="diary" onclick="setWellTab('diary')">Diary</button>
      <button class="well-tab" data-tab="highlights" onclick="setWellTab('highlights')">Highlights</button>
    </div>

    <!-- Tab: Check-in -->
    <div class="well-tab-content active" id="tab-checkin">
      <div class="well-card">
        <div class="well-title">Today's mood <em>tap one</em></div>
        <div class="mood-row" id="moodRow">
          <button class="mood-btn" data-m="1" onclick="setDailyMood(1)">😔</button>
          <button class="mood-btn" data-m="2" onclick="setDailyMood(2)">😕</button>
          <button class="mood-btn" data-m="3" onclick="setDailyMood(3)">😐</button>
          <button class="mood-btn" data-m="4" onclick="setDailyMood(4)">🙂</button>
          <button class="mood-btn" data-m="5" onclick="setDailyMood(5)">✨</button>
        </div>
      </div>

      <div class="well-card">
        <div class="well-title">Sleep <em>last night</em></div>
        <div class="sleep-grid">
          <div class="sleep-input-wrap">
            <div class="sleep-label">Bed</div>
            <input type="time" class="sleep-input" id="bedTime" onchange="calcSleep()">
          </div>
          <div class="sleep-input-wrap">
            <div class="sleep-label">Wake</div>
            <input type="time" class="sleep-input" id="wakeTime" onchange="calcSleep()">
          </div>
        </div>
        <div class="sleep-result" id="sleepResult" style="display:none">
          <div class="sleep-hours" id="sleepHours">—</div>
          <div class="sleep-hours-label" id="sleepLabel">hours</div>
        </div>
      </div>

      <div class="well-card">
        <div class="well-title">Past 7 days</div>
        <div class="chart-week" id="chartWeek"></div>
      </div>
    </div>

    <!-- Tab: Diary -->
    <div class="well-tab-content" id="tab-diary">
      <div class="well-card" id="journalCard">
        <div class="well-title">Diary <em id="journalTitleSub">private</em></div>
        <div id="journalContent"></div>
      </div>
    </div>

    <!-- Tab: Highlights -->
    <div class="well-tab-content" id="tab-highlights">
      <div class="highlights-intro">
        <div class="highlights-title-row">
          <div>
            <div class="serif" style="font-style:italic;font-size:18px;color:var(--ink)">One photo a week</div>
            <div style="font-size:12px;color:var(--ink-faint);margin-top:4px;font-family:'Fraunces',serif;font-style:italic">Build a year of moments — slowly, gently.</div>
          </div>
          <div class="week-badge" id="weekBadge">Week —</div>
        </div>
        <div id="thisWeekStatus"></div>
        <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
      </div>
      <div class="highlights-grid" id="highlightsGrid"></div>
    </div>
  </div>
</div>

</div><!-- /app -->

<!-- Photo lightbox -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-actions">
    <button onclick="replaceCurrentHighlight()">Replace</button>
    <button onclick="deleteCurrentHighlight()">Delete</button>
  </div>
  <div class="lightbox-meta" id="lightboxMeta"></div>
</div>

<div class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V21H3z"/><path d="M9 21V12h6v9"/></svg>
    <span class="nav-label">Home</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='routine.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2C8 2 6 6 6 9c0 6 6 13 6 13s6-7 6-13c0-3-2-7-6-7z"/></svg>
    <span class="nav-label">Ritual</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='products.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 5h18l-2 14H5z"/><path d="M9 5V3h6v2"/></svg>
    <span class="nav-label">Shelf</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='motivation.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2.4 7.6H22l-6.2 4.5 2.4 7.6L12 17.2 5.8 21.7l2.4-7.6L2 9.6h7.6z"/></svg>
    <span class="nav-label">Word</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='scripture.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4v16a2 2 0 0 0 2 2h14V2H6a2 2 0 0 0-2 2z"/><path d="M8 6h8M8 10h8M8 14h5"/></svg>
    <span class="nav-label">Verse</span>
  </button>
  <button class="nav-btn active" onclick="window.location.href='wellness.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span class="nav-label">Inner</span>
  </button>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script>
async function init(){
  await loadFromCloud();
  renderWellness();
  setTimeout(()=>{ $('loader').classList.add('hide'); setTimeout(()=>$('loader').remove(),700); },600);
}
init();
</script>
</body>
</html>
