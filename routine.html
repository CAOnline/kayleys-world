<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Ritual — Kayley's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="aurora"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="loader" id="loader">
  <div class="loader-mark">Kayley's World</div>
  <div class="loader-line"></div>
</div>
<div class="app">

<div class="page active" id="skincare">
  <div class="page-header">
    <div class="page-title-stack">
      <div class="eyebrow">The Ritual</div>
      <h2 class="page-title">Today's<br><em>Routine</em></h2>
    </div>
  </div>

  <div class="flow-container">
    <div class="week-strip" id="weekStrip"></div>

    <div class="time-toggle">
      <button class="active" data-time="am" onclick="setTime('am')">Morning</button>
      <button data-time="pm" onclick="setTime('pm')">Evening</button>
    </div>

    <div id="smartHint"></div>

    <div class="section-eyebrow">How is skin feeling?</div>
    <div class="mood-grid" id="moodGrid">
      <div class="mood-pill" data-mood="normal" onclick="setMood('normal')">
        <div class="mood-icon">◯</div>
        <div><div class="mood-name">Calm</div><div class="mood-desc">Normal day</div></div>
      </div>
      <div class="mood-pill" data-mood="oily" onclick="setMood('oily')">
        <div class="mood-icon">◑</div>
        <div><div class="mood-name">Oily</div><div class="mood-desc">Shiny / congested</div></div>
      </div>
      <div class="mood-pill" data-mood="breakout" onclick="setMood('breakout')">
        <div class="mood-icon">✦</div>
        <div><div class="mood-name">Breakout</div><div class="mood-desc">Spots active</div></div>
      </div>
      <div class="mood-pill" data-mood="sensitive" onclick="setMood('sensitive')">
        <div class="mood-icon">❀</div>
        <div><div class="mood-name">Sensitive</div><div class="mood-desc">Reactive day</div></div>
      </div>
      <div class="mood-pill" data-mood="dull" onclick="setMood('dull')">
        <div class="mood-icon">✺</div>
        <div><div class="mood-name">Dull</div><div class="mood-desc">Glow boost</div></div>
      </div>
      <div class="mood-pill" data-mood="mask" onclick="setMood('mask')">
        <div class="mood-icon">⌘</div>
        <div><div class="mood-name">Mask Day</div><div class="mood-desc">Treat yourself</div></div>
      </div>
    </div>

    <button class="check-shelf-btn" onclick="checkRoutineAgainstShelf()">
      <span class="check-shelf-icon">✓</span>
      <span>Check my shelf for this routine</span>
    </button>

    <div id="routine"></div>
  </div>
</div>

</div><!-- /app -->

<!-- Swap picker modal -->
<div class="modal-overlay" id="swapModal" onclick="if(event.target===this)closeSwapModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="swapModalTitle">Use your own</div>
    <div class="modal-sub" id="swapModalSub">From your shelf</div>
    <div id="swapModalBody"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-secondary" onclick="window.location.href='products.html'">Add to shelf</button>
      <button class="btn-primary" onclick="closeSwapModal()">Close</button>
    </div>
  </div>
</div>

<!-- Shelf check modal -->
<div class="modal-overlay" id="checkModal" onclick="if(event.target===this)closeCheckModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Shelf check</div>
    <div class="modal-sub">Today's routine vs what you actually have</div>
    <div id="checkModalBody"></div>
    <div class="modal-actions" style="margin-top:18px">
      <button class="btn-secondary" onclick="window.location.href='products.html'">Open shelf</button>
      <button class="btn-primary" onclick="closeCheckModal()">Done</button>
    </div>
  </div>
</div>

<div class="bottom-nav bottom-nav-duo">
  <button class="nav-btn" onclick="window.location.href='index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V21H3z"/><path d="M9 21V12h6v9"/></svg>
    <span class="nav-label">Home</span>
  </button>
  <button class="nav-btn active" onclick="window.location.href='routine.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2C8 2 6 6 6 9c0 6 6 13 6 13s6-7 6-13c0-3-2-7-6-7z"/></svg>
    <span class="nav-label">Ritual</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='products.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 5h18l-2 14H5z"/><path d="M9 5V3h6v2"/></svg>
    <span class="nav-label">Shelf</span>
  </button>
  <button class="nav-btn" onclick="window.location.href='scripture.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4v16a2 2 0 0 0 2 2h14V2H6a2 2 0 0 0-2 2z"/><path d="M8 6h8M8 10h8M8 14h5"/></svg>
    <span class="nav-label">Verse</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
async function init(){
  await loadFromCloud();
  renderSkincare();
  setTimeout(()=>{
    $('loader').classList.add('hide');
    setTimeout(()=>$('loader').remove(),700);
  },700);
}
init();
</script>
</body>
</html>
