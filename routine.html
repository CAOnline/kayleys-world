<script>
// ── Steve companion ──
const steveAM = {
  normal:  "good morning ✨ skin's looking calm today — let's keep it that way",
  oily:    "oily day? no stress 💧 we've got the right steps for this",
  breakout:"spots happen 🌿 tea tree and patches incoming — you've got this",
  sensitive:"gentle mode ON 🌸 Steve is being very careful today",
  dull:    "glow up incoming ☀️ vit C is about to do its thing",
  mask:    "mask day!! Steve is SO excited for you 🫧"
};
const stevePM = {
  normal:  "evening routine time 🌙 wash the day away lovely",
  oily:    "salicylic tonight 💚 let's clear those pores while you sleep",
  breakout:"retinol night incoming ✦ tea tree first, then we go in",
  sensitive:"gentle gentle 🌸 no actives tonight — just calm and hydrate",
  dull:    "glow serums tonight 🌹 rosehip as your last step, chef's kiss",
  mask:    "mask night! 🧖 not retinol night tho — Steve checked 👀"
};
const steveTaps = [
  "hi Kayley!! 💜","you smell amazing already","Steve believes in you ✨",
  "don't forget SPF!! ☀️","you're doing so well 🌸","almost glowing fr 👽"
];
let tapIdx = 0;

function steveSpeak(msg){
  const b = document.getElementById('steveBubble');
  if(!b) return;
  b.textContent = msg;
  b.style.opacity = '1';
  b.style.transform = 'translateY(0)';
  clearTimeout(steveSpeak._t);
  steveSpeak._t = setTimeout(()=>{
    b.style.opacity = '0';
    b.style.transform = 'translateY(6px)';
  }, 4000);
}

function steveTap(){
  steveSpeak(steveTaps[tapIdx % steveTaps.length]);
  tapIdx++;
  // little bounce
  const svg = document.querySelector('#steveCompanion svg');
  if(svg){ svg.style.animation='none'; void svg.offsetWidth; svg.style.animation='steveFloat 4s ease-in-out infinite'; }
}

function steveReact(time, mood){
  const bank = time === 'am' ? steveAM : stevePM;
  const msg = bank[mood] || bank.normal;
  setTimeout(()=> steveSpeak(msg), 300);
}

// Hook into setTime and setMood
const _origSetTime = typeof setTime === 'function' ? setTime : null;
const _origSetMood = typeof setMood === 'function' ? setMood : null;

function setTime(t){
  state.time = t;
  renderSkincare();
  steveReact(t, state.mood);
}
function setMood(m){
  state.mood = m;
  renderSkincare();
  steveReact(state.time, m);
}

async function init(){
  await loadFromCloud();
  renderSkincare();
  // Steve says hi on load
  const hour = new Date().getHours();
  const timeOfDay = hour < 12 ? 'am' : 'pm';
  setTimeout(()=> steveSpeak(hour < 12 ? "good morning Kayley ✨ ready to glow?" : hour < 19 ? "hey lovely 🌸 afternoon routine?" : "evening ritual time 🌙 let's go"), 1200);
  setTimeout(()=>{
    $('loader').classList.add('hide');
    setTimeout(()=>$('loader').remove(),700);
  },800);
}
init();
</script>
